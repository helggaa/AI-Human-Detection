[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-human-detection"
version = "1.1.0"
description = "End-to-end deep learning pipeline for distinguishing authentic human images from AI-generated human images"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "HELGA" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

[tool.black]
line-length = 79
target-version = ["py311"]

exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | notebooks
)/
'''

[tool.ruff]
line-length = 79
target-version = "py311"

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "notebooks",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
]

ignore = []